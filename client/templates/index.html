{% extends "base.html" %}
{% block content %}
<!-- 并发上传状态 -->
    <div class="card" id="uploadStatus">
        <h2>当前上传</h2>
        <div class="row">
            <label>并发任务:</label>
            <span id="concurrencyStatus">0 / 1 个文件</span>
        </div>
        <div class="row">
            <label>总上传速度:</label>
            <span id="uploadSpeed" class="speed">0 B/s</span>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                    <tr><th>文件路径</th><th>大小</th><th>已上传</th><th>进度</th><th>状态</th><th>速度</th></tr>
                </thead>
                <tbody id="activeUploadTable">
                    <tr><td colspan="6">暂无正在上传的文件</td></tr>
                </tbody>
            </table>
        </div>
        <p id="retrySummary" class="hint"></p>
    </div>
{% endblock %}
{% block scripts %}
{% endblock %}
